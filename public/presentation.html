<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LeadRadar · Presentation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap">
<style>
  /* Placeholder until the pitch deck is published; replace this file (or link) with the presentation. */
  :root { color-scheme:dark; --surface-000:#040814; --surface-100:#1c2030; --ink:#f4f4f8; --ink-muted:#9aa0ad; --border-strong:#7a8090; --lime:#5fdc8a; --lime-hover:#74e39c; --on-lime:#080808; --orange-soft:#3a2a12; --orange-ink:#ffb46b; --focus:#5fdc8a; --shadow-card:0 8px 24px #04081466; }
  @media (prefers-color-scheme: light) { :root { color-scheme:light; --surface-000:#f4f4f8; --surface-100:#fcfcfc; --ink:#080808; --ink-muted:#5c6270; --border-strong:#767b88; --lime-hover:#4fcf7c; --orange-soft:#fff0e0; --orange-ink:#b0570a; --focus:#1f7a3a; --shadow-card:0 8px 24px #0808081a; } }
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--surface-000); color:var(--ink); font:400 16px/25px "Outfit","Segoe UI",system-ui,sans-serif; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .card { max-width:640px; width:100%; background:var(--surface-100); border-radius:24px; padding:40px; box-shadow:var(--shadow-card); }
  .brand { display:flex; align-items:center; gap:12px; font-weight:500; font-size:18px; color:inherit; text-decoration:none; margin-bottom:32px; }
  .brand svg { width:32px; height:32px; }
  .badge { display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:500; background:var(--orange-soft); color:var(--orange-ink); }
  h1 { font-weight:400; font-size:44px; line-height:48px; letter-spacing:-.01em; margin:16px 0 12px; }
  p { color:var(--ink-muted); margin:0 0 28px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 24px; border-radius:999px; border:1px solid var(--border-strong); color:var(--ink); font-weight:500; font-size:15px; text-decoration:none; }
  .btn.primary { background:var(--lime); color:var(--on-lime); border-color:transparent; }
  .btn.primary:hover { background:var(--lime-hover); }
</style>
</head>
<body>
  <main class="card">
    <a class="brand" href="index.html" aria-label="LeadRadar home"><svg viewBox="245 195 532 632" aria-hidden="true"><polygon points="295,333 384,245 384,689 620,689 708,777 295,777" fill="currentColor"/><polygon points="590,333 727,412 453,570 453,412" fill="currentColor"/><polygon points="727,412 727,570 590,650 453,570" fill="#88888c"/></svg>LeadRadar</a>
    <span class="badge">Coming soon</span>
    <h1>The presentation is on its way.</h1>
    <p>The GigaHack 2026 pitch deck will be published here. Meanwhile, explore the live demo or read the code.</p>
    <div class="row">
      <a class="btn primary" href="/app">See the demo</a>
      <a class="btn" href="https://github.com/MihailCardauc/leadradar" target="_blank" rel="noopener noreferrer">See GitHub</a>
      <a class="btn" href="index.html">Back to the site</a>
    </div>
  </main>
</body>
</html>
